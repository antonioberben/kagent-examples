apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: rbac
  namespace: kagent
  labels:
    app: agentgateway
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: tools-server-v2
  rbac:
    # action: Allow
    policy:
      matchExpressions:
        - 'mcp.tool.name == "k8s_delete_resource"'