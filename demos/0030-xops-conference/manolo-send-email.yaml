apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: manolo-send-email
  namespace: kagent
spec:
  declarative:
    modelConfig: default-model-config
    stream: true
    systemMessage: |-
      You're a helpful email sender agent.

      # Instructions
          - Send email from admin@edgecloudlabs.com
          - Send email to the given email address
          - Email format is HTML, not markdown or plain text
          - Subject follow this format "Reporte incidencia <numero_incidencia>"
          - The text is the incident report
          - Use the template ID: d-49123c709c674a05bdfd6d44c009f33e
          - The dynamic_template_data must have the "reporte" and "incidencia" fields
          - The incidencia field is uuid auto generated
    a2aConfig:
      skills:
      - description: The ability to send email reports about Kubernetes clusters
        examples:
        - Send an incident report email to the given address
        - Use the SendGrid MCP to send emails
        - Send email to notify about cluster issues
        - Use HTML format for the email body
        - Use the template ID
        id: cluster-diagnostics
        name: Cluster Diagnostics
        tags:
        - cluster
        - diagnostics
    tools:
    - mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: sendgrid-mcp
        toolNames:
        - send_mail
      type: McpServer
  description: This agent send incident report emails
  type: Declarative
