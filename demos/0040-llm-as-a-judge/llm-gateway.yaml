apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: kagent
  labels:
    lab: llm-as-a-judge
spec:
  ai:
    provider:
      openai:
        model: gpt-4.1-mini
  policies:
    auth:
      secretRef:
        name: openai-secret
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-gateway
  namespace: kagent
  labels:
    lab: llm-as-a-judge
spec:
  gatewayClassName: agentgateway
  listeners:
  - protocol: HTTP
    port: 8787
    name: http
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-openai
  namespace: kagent
  labels:
    lab: llm-as-a-judge
spec:
  parentRefs:
  - name: llm-gateway
    namespace: kagent
  rules:
  - backendRefs:
    - name: openai
      group: agentgateway.dev
      kind: AgentgatewayBackend
