# AgentRegistry Helm values.
#
# The previous content of this file (top-level `registry:`, `mcpServers:`,
# `skills:` keys) was INERT — the agentregistry chart has no such values
# (its schema is config.* / database.* / image.* / service.*), so Helm
# silently ignored them and nothing was ever registered.
#
# Runtime configuration (database, service type, JWT key) is passed by
# deploy.sh via `--set` (see phase "agentregistry + postgres").
#
# The catalog (agents, skills, MCP servers) is NOT seeded through Helm. It is
# applied to the running registry via its batch apply API from
# manifests/agentregistry-catalog.yaml (see deploy.sh "register catalog" phase).
#
# This file is intentionally minimal; keep only real chart keys here if you
# need to override defaults.
replicaCount: 1
