# Solo Enterprise for Kagent - Management Helm Values
# Installs solo-enterprise-ui with auto provider for demo/testing

cluster: agentic-ai-kagent

# Enable kagent product
products:
  kagent:
    enabled: true

# OIDC - Keycloak (shared realm "agentregistry" with agentregistry-enterprise).
# issuer injected at install: --set-string oidc.issuer=$KEYCLOAK_ISSUER
# UI login becomes Keycloak SSO (admin-user/password). rbac.roleMapping maps the
# "Groups" claim -> admins=global.Admin by default, matching the Keycloak realm.
oidc:
  issuer: ""
ui:
  backend:
    oidc:
      clientId: kagent-backend
      secretRef: ui-backend-oidc-secret
      secretKey: clientSecret
  frontend:
    oidc:
      clientId: kagent-ui

# ClickHouse configuration (use emptyDir for demo)
clickhouse:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
      ephemeral-storage: 50Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi
  persistentVolume:
    enabled: false
  keeper:
    enabled: false
  auth:
    enabled: true
    username: default
    password: password
