# Solo Enterprise for Kagent - Management Helm Values
# Installs solo-enterprise-ui with auto provider for demo/testing

cluster: agentic-ai-kagent

# Enable kagent product
products:
  kagent:
    enabled: true

# OIDC - Use auto provider (no login required)
oidc:
  issuer: ""
  # Register kagent-enterprise as a static client for OBO token exchange
  staticClients:
    - id: kagent-enterprise
      name: "Kagent Enterprise"
      secret: kagent-enterprise-secret
      redirectURIs:
        - "http://localhost:8080/callback"
      # Allow client credentials grant for OBO token exchange
      grantTypes:
        - client_credentials
        - authorization_code

# ClickHouse configuration (use emptyDir for demo)
clickhouse:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
      ephemeral-storage: 50Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi
  persistentVolume:
    enabled: false
  keeper:
    enabled: false
  auth:
    enabled: true
    username: default
    password: password
