apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kagent-a2a-gateway
  namespace: kagent
  labels:
    event: agentic-world
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: a2a-http
      protocol: HTTP
      port: 8083
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-a2a-route
  namespace: kagent
  labels:
    event: agentic-world
spec:
  parentRefs:
    - name: kagent-a2a-gateway
      namespace: kagent

  hostnames:
    - "kagent-controller.kagent.svc.cluster.local"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/a2a/
      backendRefs:
        - name: kagent-controller
          port: 8083
