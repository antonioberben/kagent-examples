# Istio AuthorizationPolicy for Waypoint Proxy
# DENY team2-not-allowed from accessing k8s-agent

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-team2-to-k8s-agent
  namespace: kagent
  labels:
    policy-type: istio-authz
    event: agentic-world
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kagent-waypoint

  action: DENY
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/kagent/sa/team2-not-allowed"
      to:
        - operation:
            hosts:
              - "k8s-agent*"
            ports:
              - "8080"
