apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kagent-waypoint
  namespace: kagent
  labels:
    istio.io/waypoint-for: service
    event: agentic-world
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: Same
